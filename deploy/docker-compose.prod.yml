services:
  airfieldops:
    image: airfieldops:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: airfieldops-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${APP_ENV:-production}
    env_file:
      - ../.env
    volumes:
      - airfieldops_state:/var/lib/airfieldops

volumes:
  airfieldops_state:
    name: airfieldops_state
    external: true
