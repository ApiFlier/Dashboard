# DEVELOPMENT ONLY - uses local bind mounts for live reloading
services:
  airfieldops:
    build: .
    container_name: airfieldops-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - airfieldops_state:/var/lib/airfieldops
    environment:
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  airfieldops_state:
    name: airfieldops_state
    external: true
