<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirfieldOps Core</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=20260507-13">
</head>
<body>
    <header>
        <a href="#/" class="logo">AirfieldOps Core</a>
        <div id="status-bar" class="status-bar" style="display: none;">
            <span id="last-updated"></span>
            <button id="refresh-btn" class="refresh-btn">Refresh</button>
        </div>
        <div class="search-container">
            <input type="text" id="airport-search" placeholder="Search Airport (e.g. KAGC)">
            <button id="search-btn">Go</button>
        </div>
    </header>

    <nav id="main-nav" style="display: none;">
        <a href="#/" id="nav-home">Dashboard</a>
        <a href="#/airport/current/brief" id="nav-brief">Brief</a>
        <a href="#/airport/current/weather" id="nav-weather">Weather</a>
        <a href="#/airport/current/runways" id="nav-runways">Runways</a>
        <a href="#/airport/current/alternates" id="nav-alternates">Alternates</a>
        <a href="#/airport/current/hazards" id="nav-hazards">Hazards</a>
        <a href="#/settings" id="nav-settings">Settings</a>
    </nav>

    <main id="app-content">
        <div class="loading">Initializing...</div>
    </main>

    <footer>
        <p><strong>Advisory display only.</strong> Not for certified flight planning, dispatch, release, or operational control.</p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem; opacity: 0.7;">Data sources: AviationWeather.gov, NWS api.weather.gov</p>
    </footer>

    <script src="/static/js/utils.js?v=20260507-13"></script>
    <script src="/static/js/api.js?v=20260507-13"></script>
    <script src="/static/js/cards.js?v=20260507-13"></script>
    <script src="/static/js/app.js?v=20260507-13"></script>
</body>
</html>
